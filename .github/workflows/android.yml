name: Android Debug CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Audit research catalog (no unapproved exercise)
        run: python3 scripts/audit_catalog.py
      - name: Audit review queues and category conflicts
        run: python3 scripts/audit_review_queues.py
      - name: Verify source evidence and quarantine unsupported variants
        run: python3 scripts/verify_catalog_evidence.py
      - name: Validate offline research browsing assets and difficulty labels
        run: python3 scripts/validate_research_assets.py
      - name: Validate proposed family groups and per-level variants
        run: python3 scripts/validate_family_groups.py
      - name: Verify 90 MB AI asset manifest and counters
        run: python3 scripts/validate_ai_manifest.py
      - name: Validate canonical catalog export
        run: python3 scripts/validate_catalog_reviews.py
      - name: Catalog validation unit tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Download and authenticate real GGUF weights (offline APK)
        run: python3 scripts/fetch_offline_model.py
      - name: Verify authenticated GGUF weights are in assets
        run: python3 scripts/fetch_offline_model.py --check
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Tests and debug APK
        run: gradle --no-daemon :app:verifyShadowCoreModelBudget :app:verifyOfflineAiResourceBudget :app:testDebugUnitTest :app:assembleDebug
      - name: Report APK size (informational)
        if: success()
        run: |
          python3 - <<'PY'
          import os
          path = "app/build/outputs/apk/debug/app-debug.apk"
          if os.path.isfile(path):
              print(f"Debug APK: {os.path.getsize(path):,} bytes")
              print("APK size is not identical to the 90MB offline AI resource budget.")
          else:
              raise SystemExit("APK output missing")
          PY
      - name: Validate APK structure and Android debug signature
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file() or apk.stat().st_size == 0:
              raise SystemExit("APK missing or empty")
          try:
              with ZipFile(apk) as archive:
                  if archive.testzip() is not None:
                      raise SystemExit("APK ZIP entry damaged")
                  names = set(archive.namelist())
                  assert "AndroidManifest.xml" in names, "APK has no manifest"
                  assert "classes.dex" in names, "APK has no executable DEX"
          except (BadZipFile, AssertionError) as error:
              raise SystemExit(f"APK package invalid: {error}")
          print("APK archive and basic Android contents: OK")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/debug/app-debug.apk
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solo-leveling-gym-breaker-debug-unsigned-for-production
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
